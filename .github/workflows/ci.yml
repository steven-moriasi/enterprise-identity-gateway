name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app tests
      - run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: enterprise-identity-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate realm and Compose configuration
        run: |
          python -m json.tool keycloak/enterprise-realm.json >/dev/null
          docker compose config --quiet
      - name: Start identity stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify readiness and service identity
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready
          access_token="$(
            curl --fail --silent --show-error \
              --request POST \
              http://localhost:8080/realms/enterprise/protocol/openid-connect/token \
              --data-urlencode grant_type=client_credentials \
              --data-urlencode client_id=automation-service \
              --data-urlencode client_secret=local-service-secret |
              jq -r .access_token
          )"
          test -n "${access_token}"
          curl --fail --silent --show-error \
            --request POST \
            http://localhost:8000/api/service/jobs \
            --header "Authorization: Bearer ${access_token}" |
            jq -e '.action == "service_job.accepted"'
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop identity stack
        if: always()
        run: docker compose down --volumes
